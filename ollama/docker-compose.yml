services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./data:/root/.ollama
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - company-net

networks:
  company-net:
    external: true

