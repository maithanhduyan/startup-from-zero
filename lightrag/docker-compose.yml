services:
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      # Thư mục lưu trữ dữ liệu RAG
      - ./data/rag_storage:/app/data/rag_storage
      # Thư mục chứa documents để index
      - ./data/inputs:/app/data/inputs
      # File cấu hình (tùy chọn)
      - ./config.ini:/app/config.ini
      # File biến môi trường
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      # Cấu hình server
      - HOST=0.0.0.0
      - PORT=9621

      # Cấu hình LLM (sử dụng OpenAI làm mặc định)
      - LLM_BINDING=${LLM_BINDING:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-https://api.openai.com/v1}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY}

      # Cấu hình Embedding
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - EMBEDDING_BINDING_HOST=${EMBEDDING_BINDING_HOST:-https://api.openai.com/v1}
      - EMBEDDING_BINDING_API_KEY=${EMBEDDING_BINDING_API_KEY}

      # Cấu hình Storage (mặc định sử dụng local storage)
      - LIGHTRAG_KV_STORAGE=${LIGHTRAG_KV_STORAGE:-JsonKVStorage}
      - LIGHTRAG_VECTOR_STORAGE=${LIGHTRAG_VECTOR_STORAGE:-NanoVectorDBStorage}
      - LIGHTRAG_GRAPH_STORAGE=${LIGHTRAG_GRAPH_STORAGE:-NetworkXStorage}
      - LIGHTRAG_DOC_STATUS_STORAGE=${LIGHTRAG_DOC_STATUS_STORAGE:-JsonDocStatusStorage}

      # Cấu hình xử lý document
      - SUMMARY_LANGUAGE=${SUMMARY_LANGUAGE:-Vietnamese}
      - MAX_ASYNC=${MAX_ASYNC:-4}
      - MAX_PARALLEL_INSERT=${MAX_PARALLEL_INSERT:-2}

      # Cache LLM response
      - ENABLE_LLM_CACHE=${ENABLE_LLM_CACHE:-true}
      - ENABLE_LLM_CACHE_FOR_EXTRACT=${ENABLE_LLM_CACHE_FOR_EXTRACT:-true}
    restart: unless-stopped
    extra_hosts:
      # Cho phép container truy cập localhost của host machine
      - "host.docker.internal:host-gateway"
    networks:
      - company-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9621/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  company-net:
    external: true